name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: secondbrain
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: secondbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secondbrain -d secondbrain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://secondbrain:ci-only-database-password@127.0.0.1:5432/secondbrain_test?schema=public
      TEST_DATABASE_URL: postgresql://secondbrain:ci-only-database-password@127.0.0.1:5432/secondbrain_test?schema=public
      BETTER_AUTH_SECRET: ci-only-auth-secret-never-use-in-production-000000
      BETTER_AUTH_URL: http://localhost:3000
      INITIAL_ADMIN_EMAIL: tests@example.test
      INITIAL_ADMIN_PASSWORD: Ci-only-test-password-2026!
      INITIAL_ADMIN_NAME: Test User
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:migrate:prod
      - run: npm run db:bootstrap
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production image without database or deployment secrets
        run: docker build --tag secondbrain:ci .
      - name: Check shell scripts
        run: |
          bash -n scripts/backup.sh scripts/restore.sh
          sh -n scripts/docker-entrypoint.sh
